<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>人员周报 - 项目管理系统</title>
    <script src="auth.js"></script>
    <script src="dark-mode.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; }
        header h1 { font-size: 24px; }
        nav { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        nav a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; background: rgba(255,255,255,0.2); }
        nav a:hover { background: rgba(255,255,255,0.3); }
        nav a.active { background: rgba(255,255,255,0.4); }

        main { padding: 20px; max-width: 1000px; margin: 0 auto; }

        .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .btn { padding: 9px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
               background: white; color: #667eea; border: 1px solid #667eea; font-weight: 500; }
        .btn:hover { background: #667eea; color: white; }
        .btn.primary { background: #667eea; color: white; }
        .btn.primary:hover { opacity: .88; }
        /* ★ 导出按钮对齐 report.html 的 .export-btn（主色实底白字） */
        .btn.export { padding: 12px 24px; background: #667eea; color: white; border: 1px solid #667eea; font-size: 14px; }
        .btn.export:hover { background: #764ba2; border-color: #764ba2; color: white; }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .spacer { flex: 1; }
        .period-label { font-size: 14px; color: #666; }

        .report-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }

        .report-header { border-bottom: 2px solid #667eea; padding-bottom: 18px; margin-bottom: 26px; }
        .report-title { font-size: 26px; font-weight: bold; }
        .report-period { color: #666; font-size: 15px; margin-top: 5px; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #f9f9f9; padding: 18px; border-radius: 8px; text-align: center; }
        .stat-card h4 { color: #666; font-size: 14px; margin-bottom: 5px; font-weight: 500; }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #667eea; }
        .stat-card .number.warn { color: #f44336; }
        .stat-card .sub { font-size: 11px; color: #666; margin-top: 4px; }

        .section { margin-bottom: 26px; }
        .section-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 15px;
                         padding-left: 10px; border-left: 3px solid #667eea; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #667eea; color: white; padding: 9px 6px; text-align: left; font-weight: 500; white-space: nowrap; }
        td { padding: 8px 6px; border-bottom: 1px solid #eee; }

        /* ★ 2026-11-10 修硬伤：14 列总宽超出容器 → 末列「本期评价」被硬裁切，
           导出 PNG 是静态快照，.tbl-scroll 的横向滚动救不回来，整列会丢失。
           对策：table-layout:fixed + 显式百分比列宽，让表格永不超容器。 */
        #overview-table { table-layout: fixed; }
        #overview-table th, #overview-table td { overflow: hidden; text-overflow: ellipsis; }
        #overview-table col.c-idx   { width: 3%; }
        #overview-table col.c-name  { width: 7%; }
        #overview-table col.c-pos   { width: 12%; }
        #overview-table col.c-score { width: 6%; }
        #overview-table col.c-num   { width: 6%; }
        #overview-table col.c-sm    { width: 5%; }
        #overview-table col.c-proj  { width: 6%; }
        #overview-table col.c-rate  { width: 6%; }
        #overview-table col.c-rating{ width: 16%; }
        /* 姓名不折行；岗位/条线过长则省略号（它是最占宽的一列） */
        #overview-table td:nth-child(2) { white-space: nowrap; }
        #overview-table td:nth-child(3) { white-space: nowrap; }
        tr:nth-child(even) td { background: #f8f9fa; }
        .num-cell { text-align: center; font-variant-numeric: tabular-nums; }
        .tbl-scroll { overflow-x: auto; }

        /* ★ 2026-11-10 修：span 默认 inline，height 不生效 → 进度条永远空。
           改为 inline-block，容器才有确定高度。 */
        .bar { display: inline-block; vertical-align: middle; width: 100%; height: 7px;
               background: #e0e0e0; border-radius: 4px; overflow: hidden; min-width: 60px; }
        .bar > i { display: block; height: 100%; border-radius: 4px; background: #667eea; }
        .rate { font-weight: 600; }
        /* ★ 语义色：色相与 report.html 完全同源(#4caf50/#ff9800/#f44336)，
             但小号文字改用同色相深色档(900)，对比度从 2.16~3.68 提升到 4.6~5.9(达 WCAG AA) */
        .rate.good { color: #2e7d32; } .rate.mid { color: #bd3f00; } .rate.low { color: #c62828; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px; white-space: nowrap; }
        .badge.lead { background: #eef0fd; color: #5a4fcf; border: 1px solid #c3c7f5; }
        .badge.join { background: #eceff1; color: #546e7a; border: 1px solid #b0bec5; }
        .badge.rate-outstanding { background: #fff3e0; color: #bd3f00; border: 1px solid #ffcc80; }
        .badge.rate-excellent { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .badge.rate-normal { background: #f5f5f5; color: #6d6d6d; border: 1px solid #e0e0e0; }
        .badge.rate-insufficient { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .badge.rate-none { background: #fff; color: #bbb; border: 1px dashed #ddd; }

        /* 人员卡片 */
        .person-card { border: 1px solid #e8e8e8; border-radius: 10px; padding: 16px; margin-bottom: 12px; background: #fff; }
        .person-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .person-name { font-size: 16px; font-weight: 600; }
        .person-meta { font-size: 12px; color: #888; }
        .person-rank { margin-left: auto; font-size: 12px; color: #667eea; font-weight: 600; }
        .person-nums { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #555; margin-bottom: 8px; }
        .person-nums b { color: #667eea; font-size: 14px; }
        .person-nums .od b { color: #f44336; }
        .person-projects { margin-top: 8px; font-size: 12px; }
        .pj-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
        .pj-name { flex: 0 0 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pj-bar { flex: 1; }
        .pj-meta { flex: 0 0 auto; white-space: nowrap; text-align: right; color: #888;
                   font-variant-numeric: tabular-nums; margin-left: 8px; }
        .pj-tasks { margin-top: 6px; padding-left: 4px; color: #777; }
        .pj-tasks div { padding: 2px 0; }

        .empty-state { text-align: center; color: #999; padding: 30px; font-size: 13px; }

        /* 主导/参与任务明细（可折叠） */
        .task-block { margin-top: 10px; border-top: 1px dashed #e0e0e0; padding-top: 8px; }
        .task-block > summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: #667eea;
                                list-style: none; padding: 4px 0; user-select: none; }
        .task-block > summary::-webkit-details-marker { display: none; }
        .task-block > summary::before { content: '▸ '; color: #90a4ae; }
        .task-block[open] > summary::before { content: '▾ '; }
        .task-block > summary:hover { color: #764ba2; }
        .task-table { margin-top: 6px; font-size: 12px; }
        .task-table th { background: #f8f9fa; color: #666; padding: 6px 6px; font-size: 11.5px; }
        .task-table td { padding: 5px 6px; }
        .kind { color: #667eea; font-size: 11px; }
        .rating-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #555; margin-top: 8px; }
        .rating-legend em { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

        @media (max-width: 800px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .pj-name { flex-basis: 130px; }
        }
        @media print {
            header, .toolbar { display: none !important; }
            body { background: #fff; }
            .report-container { box-shadow: none; padding: 0; }
            .person-card { break-inside: avoid; }
        }
    </style>
</head>
<body>
<header>
    <h1>👥 人员维度周报</h1>

</header>

<main>
    <div class="toolbar">
        <button class="btn" onclick="loadReport(-1)">← 上周</button>
        <button class="btn" onclick="loadReport(0)">本周</button>
        <button class="btn" onclick="loadWindow(28)">近 4 周</button>
        <button class="btn" onclick="loadWindow(56)">近 8 周</button>
        <span class="period-label" id="period-label">加载中…</span>
        <span class="spacer"></span>
        <button class="btn export" onclick="exportReport('html')">📥 导出 HTML</button>
        <button class="btn export" onclick="exportReport('pdf')">📄 导出 PDF</button>
        <button class="btn export" onclick="exportReport('png')">🖼️ 导出 PNG</button>
    </div>

    <div class="report-container" id="person-report">
        <div class="report-header">
            <div class="report-title">👥 人员维度周报</div>
            <div class="report-period" id="report-period"></div>
        </div>

        <div class="stats-grid" id="stats-grid"></div>

        <div class="section">
            <div class="section-title">📊 人员总览（按工作量分排序）</div>
            <div class="tbl-scroll">
                <table id="overview-table">
                    <colgroup>
                        <col class="c-idx"><col class="c-name"><col class="c-pos">
                        <col class="c-score">
                        <col class="c-num"><col class="c-num"><col class="c-sm"><col class="c-sm"><col class="c-sm"><col class="c-num">
                        <col class="c-proj"><col class="c-proj">
                        <col class="c-rate">
                        <col class="c-rating">
                    </colgroup>
                    <thead>
                    <tr>
                        <th>#</th><th>姓名</th><th>岗位/条线</th>
                        <th class="num-cell" title="本期工作量综合得分">工作量</th>
                        <th class="num-cell" title="本期有动作的负责任务数">本负</th>
                        <th class="num-cell" title="本期完成的任务数">本完</th>
                        <th class="num-cell" title="本期有推进的任务数">推进</th>
                        <th class="num-cell" title="本期新建的任务数">本新</th>
                        <th class="num-cell" title="本期有动作且已逾期的任务数">逾期</th>
                        <th class="num-cell" title="本期有动作的参与任务数">参与</th>
                        <th class="num-cell" title="本人主导的项目数">主导项</th><th class="num-cell" title="本人参与的项目数">参与项</th>
                        <th class="num-cell">完成率</th>
                        <th>本期评价</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="rating-legend" id="rating-legend"></div>
        </div>

        <div class="section">
            <div class="section-title">🗂️ 人员明细（主导项目 / 参与项目 / 工作量 / 完成情况 / 评价）</div>
            <div id="person-cards"></div>
        </div>
    </div>
</main>

<script>
const API = '/api/report';
const RATING_ORDER = ['卓越', '优秀', '正常', '不足'];
/* ★ 色块用途 → 用浅色/高饱和档（与 report.html 的 .rating-badge 同源），
   不能用文字的深色档：卓越与不足若同为深色会几乎撞色(对比度1.00，肉眼不可分) */
const RATING_COLOR = { '卓越': '#ff9800', '优秀': '#4caf50', '正常': '#9e9e9e', '不足': '#f44336' };
const WEEK_KIND = { done: '完成', progressed: '推进', new: '新增' };
const RATING_CLASS = { '卓越': 'rate-outstanding', '优秀': 'rate-excellent', '正常': 'rate-normal', '不足': 'rate-insufficient' };

let reportData = null;
let currentOffset = 0;
let currentWindow = null;   // null=自然周；整数=滚动窗口天数

async function loadReport(offset) {
    currentOffset = offset; currentWindow = null;
    await fetchReport();
}

async function loadWindow(days) {
    currentOffset = 0; currentWindow = days;
    await fetchReport();
}

async function fetchReport() {
    const label = document.getElementById('period-label');
    if (label) label.textContent = '加载中…';
    const q = currentWindow ? `window=${currentWindow}` : `offset=${currentOffset}`;
    try {
        const res = await authFetch(`${API}/person-weekly?${q}`);
        if (!res) return;
        const data = await res.json();
        if (!data.success) { alert('加载失败'); return; }
        reportData = data.report;
        render(reportData);
    } catch (e) {
        console.error(e);
        alert('加载失败：' + e.message);
    }
}

// ★ 完成率单元格：分母为 0 时不能显示 0%（那不是"完成率零"，是"本期无负责任务"）
//   分母 < 3 时百分比极不稳定（0/1 与 1/2 只差 1 个任务），补原始计数避免误读
function completionCell(p) {
    const done = p.week_done_count != null ? p.week_done_count : p.week_done;
    const act = p.week_active_count != null ? p.week_active_count : p.week_active;
    if (!act) {
        return '<span style="color:#bbb" title="本期没有本人负责且有动作的任务，完成率不适用">—</span>';
    }
    if (act < 3) {
        return `<span class="rate ${rateClass(p.completion_rate)}" title="样本仅 ${act} 个任务，百分比参考性有限">${done}/${act}</span>`
             + `<span style="color:#666;font-size:12px;margin-left:3px"> ${p.completion_rate}%</span>`;
    }
    return `<span class="rate ${rateClass(p.completion_rate)}" title="本期完成 ${done} ÷ 本期有动作 ${act}">${p.completion_rate}%</span>`;
}

function rateClass(rate) {
    if (rate >= 80) return 'good';
    if (rate >= 50) return 'mid';
    return 'low';
}

function render(r) {
    document.getElementById('report-period').textContent = `报告周期：${r.period}`;
    document.getElementById('period-label').textContent = r.period;

    const s = r.summary;
    document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><h4>本期有动作</h4><div class="number">${s.active_people}<span style="font-size:15px;color:#666">/${s.total_people}</span></div><div class="sub">共 ${s.week_active} 个任务</div></div>
        <div class="stat-card"><h4>本期完成</h4><div class="number">${s.week_done}</div><div class="sub">推进 ${s.week_progressed} · 新增 ${s.week_new}</div></div>
        <div class="stat-card"><h4>主导项目</h4><div class="number">${s.total_lead_projects}</div><div class="sub">${s.lead_people} 人主导</div></div>
        <div class="stat-card"><h4>参与任务</h4><div class="number">${s.participate_week}</div><div class="sub">已评价 ${s.week_rated} 条</div></div>
    `;

    // 总览表
    const tb = document.querySelector('#overview-table tbody');
    const rows = r.persons.filter(p => p.workload_score > 0);
    if (!rows.length) {
        tb.innerHTML = '<tr><td colspan="15" class="empty-state">本期无人员工作量数据</td></tr>';
    } else {
        tb.innerHTML = rows.map((p, i) => {
            const badges = RATING_ORDER.filter(k => p.rating_detail[k])
                .map(k => `<span class="badge ${RATING_CLASS[k]}">${k} ${p.rating_detail[k]}</span>`).join('');
            const unrated = p.unrated_count > 0 ? `<span class="badge rating-none">未评价 ${p.unrated_count}</span>` : '';
            return `<tr>
                <td class="num-cell">${i + 1}</td>
                <td><b>${esc(p.name)}</b></td>
                <td>${esc(p.position || p.role || '-')}${p.line ? ' · ' + esc(p.line) : ''}</td>
                <td class="num-cell"><b>${p.workload_score}</b></td>
                <td class="num-cell">${p.week_active}</td>
                <td class="num-cell">${p.week_done}</td>
                <td class="num-cell">${p.week_progressed}</td>
                <td class="num-cell">${p.week_new}</td>
                <td class="num-cell">${p.overdue_week ? `<span style="color:#f44336;font-weight:600">${p.overdue_week}</span>` : 0}</td>
                <td class="num-cell">${p.participate_week}</td>
                <td class="num-cell">${p.owned_projects.length}</td>
                <td class="num-cell">${p.join_projects.length}</td>
                <td class="num-cell">${completionCell(p)}</td>
                <td>${badges}${unrated}</td>
            </tr>`;
        }).join('');
    }

    // 评价图例
    const dist = r.rating_distribution || {};
    const totalR = Object.values(dist).reduce((a, b) => a + b, 0);
    document.getElementById('rating-legend').innerHTML = RATING_ORDER.map(k =>
        `<span><em style="background:${RATING_COLOR[k]}"></em>${k} ${dist[k] || 0}${totalR ? `（${Math.round((dist[k] || 0) / totalR * 100)}%）` : ''}</span>`
    ).join('') + (totalR ? '' : '<span style="color:#999">本期无评价数据</span>');

    // 人员卡片
    const box = document.getElementById('person-cards');
    if (!rows.length) {
        box.innerHTML = '<div class="empty-state">本期无人员明细</div>';
    } else {
        box.innerHTML = rows.map((p, i) => {
            const projRows = p.projects.map(pj => `
                <div class="pj-row">
                    <span class="pj-name" title="${esc(pj.project_name)}">
                        <span class="badge ${pj.role === 'lead' ? 'lead' : 'join'}">${pj.role === 'lead' ? '主导' : '参与'}</span>
                        ${esc(pj.project_name)}
                    </span>
                    <span class="pj-bar"><span class="bar"><i style="width:${Math.min(100, pj.project_progress || 0)}%;background:${(pj.project_progress || 0) >= 80 ? '#2e7d32' : (pj.project_progress || 0) >= 50 ? '#bd3f00' : '#667eea'}"></i></span></span>
                    <span class="pj-meta">${pj.completed || 0}/${pj.task_count || 0} 项 · 项目${pj.project_progress || 0}%</span>
                </div>`).join('');

            // 逾期任务：从本期主导任务里筛（只算本期有动作的）
            const odList = (p.lead_task_list || []).filter(t => t.overdue).map(t =>
                `<div style="color:#f44336">⏰ ${esc(t.name)} · ${esc(t.project_name || '')} · 截止${t.due_date || '-'} · 进度${t.progress}%</div>`).join('');

            return `<div class="person-card">
                <div class="person-head">
                    <span class="person-name">${esc(p.name)}</span>
                    <span class="person-meta">${esc(p.position || p.role || '-')}${p.line ? ' · ' + esc(p.line) : ''}${p.department ? ' · ' + esc(p.department) : ''}</span>
                    <span class="person-rank">#${i + 1} · 工作量 ${p.workload_score}</span>
                </div>
                <div class="person-nums">
                    <span>本期负责 <b>${p.week_active}</b> 项</span>
                    <span>本期完成 <b>${p.week_done}</b></span>
                    <span>推进中 <b>${p.week_progressed}</b></span>
                    <span>本期新增 <b>${p.week_new}</b></span>
                    <span class="od">逾期 <b>${p.overdue_week}</b></span>
                    <span>参与 <b>${p.participate_week}</b></span>
                    <span>完成率 <b>${p.week_active ? `${p.week_done}/${p.week_active}` : '—'}</b></span>
                    ${p.avg_rating ? `<span>评价均分 <b>${p.avg_rating}</b></span>` : ''}
                </div>
                <div class="bar"><i style="width:${p.completion_rate}%;background:${p.completion_rate >= 80 ? '#2e7d32' : p.completion_rate >= 50 ? '#bd3f00' : '#c62828'}"></i></div>
                <div class="person-projects">
                    <div style="color:#667eea;font-weight:600;margin-bottom:4px">项目（主导 ${p.owned_projects.length} / 参与 ${p.join_projects.length}）</div>
                    ${projRows || '<div style="color:#999">本期无项目任务</div>'}
                </div>
                ${leadTaskBlock(p)}
                ${partTaskBlock(p)}
                ${odList ? `<div class="pj-tasks"><b style="color:#f44336">本期逾期</b>${odList}</div>` : ''}
            </div>`;
        }).join('');
    }
}

    // ★ 本期主导的任务（只含本期有动作的）
    function leadTaskBlock(p) {
        const list = p.lead_task_list || [];
        if (!list.length) return '';
        const rows = list.map(t => {
            const st = statusBadge(t);
            const kind = (t.week_kinds || []).map(k => WEEK_KIND[k] || k).join('·');
            return `<tr>
                <td class="num-cell">${t.id}</td>
                <td>${esc(t.name)}${t.is_project_lead ? ' <span class="badge lead">项目负责人</span>' : ''}</td>
                <td>${esc(t.project_name || '-')}</td>
                <td class="num-cell">${st}</td>
                <td class="num-cell">${t.progress != null ? t.progress + '%' : '-'}</td>
                <td class="num-cell">${esc(t.due_date || '-')}</td>
                <td>${kind ? `<span class="kind">${kind}</span>` : ''}${t.rating ? ' ' + t.rating : ''}</td>
            </tr>`;
        }).join('');
        return `<details class="task-block">
            <summary>📌 本期我主导的任务（${list.length}）</summary>
            <table class="task-table"><thead><tr>
                <th class="num-cell">#</th><th>任务</th><th>项目</th>
                <th class="num-cell">状态</th><th class="num-cell">进度</th>
                <th class="num-cell">截止</th><th>本期动作/评价</th>
            </tr></thead><tbody>${rows}</tbody></table>
        </details>`;
    }

    // ★ 本期参与的任务
    function partTaskBlock(p) {
        const list = p.participate_task_list || [];
        if (!list.length) return '';
        const rows = list.map(t => {
            const st = statusBadge(t);
            const kind = (t.week_kinds || []).map(k => WEEK_KIND[k] || k).join('·');
            return `<tr>
                <td class="num-cell">${t.id}</td>
                <td>${esc(t.name)}</td>
                <td>${esc(t.project_name || '-')}</td>
                <td>${esc(t.assignee_name || '-')}</td>
                <td class="num-cell">${st}</td>
                <td class="num-cell">${t.progress != null ? t.progress + '%' : '-'}</td>
                <td class="num-cell">${esc(t.due_date || '-')}</td>
                <td>${kind ? `<span class="kind">${kind}</span>` : ''}${t.rating ? ' ' + t.rating : ''}</td>
            </tr>`;
        }).join('');
        return `<details class="task-block">
            <summary>🤝 本期我参与的任务（${list.length}）</summary>
            <table class="task-table"><thead><tr>
                <th class="num-cell">#</th><th>任务</th><th>项目</th><th>负责人</th>
                <th class="num-cell">状态</th><th class="num-cell">进度</th>
                <th class="num-cell">截止</th><th>本期动作/评价</th>
            </tr></thead><tbody>${rows}</tbody></table>
        </details>`;
    }

    function statusBadge(t) {
        if (t.status === 'completed') return '<span class="badge rate-excellent">已完成</span>';
        if (t.overdue) return '<span class="badge rate-insufficient">逾期</span>';
        if (t.status === 'in_progress') return '<span class="badge rate-normal">进行中</span>';
        return '<span class="badge rate-none">待办</span>';
    }

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// ══════════ 导出（页面同源，HTML/PDF/PNG 三态）══════════
async function collectPageCss() {
    let css = '';
    for (const sheet of document.styleSheets) {
        try {
            for (const rule of sheet.cssRules) css += rule.cssText + '\n';
        } catch (e) { /* 跨域样式表跳过 */ }
    }
    return css;
}

function buildExportHtml() {
    const node = document.getElementById('person-report');
    if (!node) return null;
    const clone = node.cloneNode(true);
    clone.querySelectorAll('button, select, input, .toolbar').forEach(n => n.remove());
    return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>人员周报 ${reportData ? reportData.period : ''}</title>
<style>${''}
html,body{background:#fff !important;}
body{max-width:1000px !important;margin:0 auto !important;padding:20px !important;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
@page{size:A4;margin:12mm}
.person-card{break-inside:avoid;page-break-inside:avoid;}
</style></head><body>${clone.outerHTML}</body></html>`;
}

async function exportReport(format) {
    if (!reportData) { alert('请先加载数据'); return; }
    const css = await collectPageCss();
    const node = document.getElementById('person-report');
    const clone = node.cloneNode(true);
    clone.querySelectorAll('button, select, input, .toolbar').forEach(n => n.remove());
    const html = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>人员周报 ${reportData.period}</title>
<style>${css}
html,body{background:#fff !important;}
body{max-width:1000px !important;margin:0 auto !important;padding:20px !important;}
/* ★ 导出时强制表格完整显示：禁止横向滚动裁切，表格按容器宽度自适应 */
.tbl-scroll{overflow:visible !important;}
#overview-table{table-layout:fixed !important;width:100% !important;}
#overview-table th,#overview-table td{overflow:hidden !important;text-overflow:ellipsis !important;}
@page{size:A4;margin:12mm}
.person-card{break-inside:avoid;page-break-inside:avoid;}
</style></head><body>${clone.outerHTML}</body></html>`;

    const fname = `PM_人员周报_${reportData.period.replace(/ ~ /, '_').replace(/-/g, '')}`;

    if (format === 'html') {
        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = fname + '.html';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        return;
    }

    // PDF / PNG：走服务端 from-html（与项目报告同一套，保证渲染一致）
    try {
        const res = await fetch('/api/report/export/from-html', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
            body: JSON.stringify({ html, format, title: 'person-weekly' })
        });
        if (res.ok) {
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = fname + '.' + format;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            return;
        }
        console.warn('服务端 from-html 失败', res.status);
    } catch (e) {
        console.warn('服务端导出异常', e);
    }
    alert('导出失败，请重试');
}

loadReport(0);
